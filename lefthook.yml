pre-commit:
  parallel: false
  commands:
    web-lint:
      glob: "apps/web/**/*.{ts,tsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    web-format:
      root: "apps/web/"
      glob: "*.{ts,tsx}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    api-lint:
      glob: "apps/api/**/*.{ts,js}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    api-format:
      root: "apps/api/"
      glob: "*.{ts,js}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
